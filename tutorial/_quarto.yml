project:
  type: book
  output-dir: _book

book:
  title: "From Raster to Portal: Creating and Publishing an EBVCube"
  author:
    - name: "Emmanuel Oceguera-Conchas"
      affiliation: "German Centre for Integrative Biodiversity Research (iDiv) ![](images/idiv-logo.png){width=22px style=\"vertical-align:text-bottom; margin-left:.4em\"} ![](images/NClogo.png){height=22px style=\"vertical-align:text-bottom; margin-left:.5em\"}"
  date: today
  repo-url: https://github.com/EBVcube/EBV_resources
  repo-branch: main
  repo-actions: [edit, issue]
  site-url: https://EBVcube.github.io/EBV_resources/
  search: true
  page-navigation: true
  sidebar:
    logo: images/ebv_logo.png
    style: docked
    background: light
  page-footer:
    left:  |
      [![](images/NClogo.png){height=50px fig-alt="NaturaConnect"}](https://naturaconnect.eu/)
    
    right: |
      :::: {style="max-width:360px; margin-left:auto; text-align:left"}
      ![](images/eu.png){height=52px fig-alt="Funded by the European Union"}

      ::: {style="color:#003399; text-align:justify; font-size:.8rem; margin-top:.6em"}
      NaturaConnect receives funding under the European Union's Horizon Europe
      research and innovation programme under grant agreement number 101060429.
      :::
      ::::
    border: true
  
  chapters:
    - index.qmd
    - 01-introduction.qmd
    - 02-installation.qmd
    - 03-preparing-data.qmd
    - 04-creating-the-cube.qmd
    - 05-validating.qmd
    - 06-uploading.qmd
    - 07-troubleshooting.qmd
    - 08-resources.qmd

bibliography: references/references.bib
csl: references/apa.csl

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    lightbox: true
    code-link: true
    code-copy: true
    code-overflow: wrap
    toc: true
    toc-depth: 3
    number-sections: true
    fig-align: center
    fig-cap-location: bottom

execute:
  echo: true
  warning: false
  message: false
  freeze: auto

knitr:
  opts_chunk:
    collapse: true
    comment: "#>"
    fig.retina: 2
    fig.align: "center"
